name: Optimized Remote Windows Environment (Audio, Mic & Tailscale)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Clean Up Disk Space (Maximize Free Space)
      run: |
        Write-Host "Cleaning up unnecessary files..."
        Remove-Item -Recurse -Force "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild" -ErrorAction SilentlyContinue
        Remove-Item -Recurse -Force "C:\Android" -ErrorAction SilentlyContinue
        Remove-Item -Recurse -Force "C:\vcpkg" -ErrorAction SilentlyContinue

    - name: Configure Windows RDP, Audio & Microphone Redirection
      run: |
        # Uzak Masaüstü Bağlantı İzinleri
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
        
        # Ses Çalma ve Mikrofon Yönlendirme (Ses Yakalama) İzinleri
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "fDisableAudioPlayback" -Value 0
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "fDisableAudioCapture" -Value 0
        
        # Windows Ses Servislerini Başlat
        Set-Service -Name "Audiosrv" -StartupType Automatic
        Start-Service -Name "Audiosrv"
        Set-Service -Name "AudioEndpointBuilder" -StartupType Automatic
        Start-Service -Name "AudioEndpointBuilder"

    - name: Create Custom Administrator User ('Draghyper')
      env:
        RDP_PASS: ${{ secrets.RDP_PASSWORD }}
      run: |
        $username = "Draghyper"
        $pass =$env:RDP_PASS
        if ([string]::IsNullOrEmpty($pass)) {$pass = "Draghyper2026!"
            Write-Host "Uyarı: RDP_PASSWORD secret bulunamadı. Varsayılan şifre kullanılıyor: Draghyper2026!" -ForegroundColor Yellow
        }
        $password = ConvertTo-SecureString$pass -AsPlainText -Force
        
        $existingUser = Get-LocalUser -Name$username -ErrorAction SilentlyContinue
        if ($null -eq$existingUser) {
            New-LocalUser -Name $username -Password$password -FullName "Draghyper Admin" -Description "Remote User"
            Add-LocalGroupMember -Group "Administrators" -Member $username
            Write-Host "Kullanıcı başarıyla oluşturuldu."
        } else {
            Set-LocalUser -Name $username -Password$password
            Write-Host "Kullanıcı zaten mevcut, şifre güncellendi."
        }

    - name: Install and Connect Tailscale (Native Windows Method)
      env:
        TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      run: |
        Write-Host "Tailscale MSI indiriliyor..."
        $msiPath = "$env:TEMP\tailscale-setup.msi"
        Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-amd64.msi" -OutFile $msiPath
        
        Write-Host "Tailscale sessiz kurulumu yapılıyor..."
        Start-Process msiexec.exe -ArgumentList "/i `"$msiPath`" /quiet /qn /norestart" -Wait
        
        Write-Host "Tailnet ağına bağlanılıyor..."
        $tailscalePath = "C:\Program Files\Tailscale\tailscale.exe"
        & $tailscalePath up --authkey="$env:TS_AUTHKEY" --accept-dns=false
        Write-Host "Tailscale başarıyla bağlandı!"

    - name: Keep-Alive & Auto-Restart Loop (Bypass 6-Hour Limit)
      run: |
        Write-Host "Environment is running. Monitoring time..."
        $duration = 345
        for ($i = 1; $i -le$duration; $i++) {             Start-Sleep -Seconds 60         }$headers = @{
            "Authorization" = "token ${{ secrets.GITHUB_TOKEN }}"
            "Accept" = "application/vnd.github.v3+json"
        }
        $body = @{
            ref = "${{ github.ref_name }}"
        } | ConvertTo-Json

        Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/actions/workflows/${{ github.workflow }}/dispatches" -Method Post -Headers $headers -Body$body
        Write-Host "Auto-restart workflow triggered successfully!"
